
AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 v2 com melhorias de segurança, parâmetros e boas práticas

Parameters:

  KeyName:
    Description: Nome da KeyPair para acesso SSH
    Type: AWS::EC2::KeyPair::KeyName

  MyIP:
    Description: IP autorizado para acesso SSH (formato x.x.x.x/32)
    Type: String
    Default: 0.0.0.0/0

Resources:

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acesso controlado à EC2 (SSH e HTTP)

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: SG-v2-melhorado

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      ImageId: ami-0427090fd1714168b  # mesmo do v1 para manter consistência

      SecurityGroupIds:
        - !Ref InstanceSecurityGroup

      Tags:
        - Key: Name
          Value: EC2-v2-melhorado

Outputs:

  InstanceId:
    Description: ID da instância EC2
    Value: !Ref EC2Instance

  PublicIP:
    Description: IP público da instância
    Value: !GetAtt EC2Instance.PublicIp
